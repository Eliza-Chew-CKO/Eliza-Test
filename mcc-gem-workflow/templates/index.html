<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check Me 💎</title>
  <style>
    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2a2d3a;
      --accent:    #6c63ff;
      --accent-lt: #8b85ff;
      --green:     #22c55e;
      --yellow:    #f59e0b;
      --red:       #ef4444;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --mcc-bg:    #1e3a2f;
      --mcc-text:  #4ade80;
      --radius:    12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    header .logo { font-size: 2.8rem; margin-bottom: 0.25rem; }
    header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent-lt), var(--green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p {
      color: var(--muted);
      margin-top: 0.4rem;
      font-size: 0.95rem;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      max-width: 760px;
      margin: 0 auto 1.5rem;
    }

    /* ── Form ── */
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    input[type="url"],
    textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      padding: 0.7rem 0.9rem;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    input[type="url"]:focus,
    textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 110px; line-height: 1.5; }

    .field { margin-bottom: 1.25rem; }

    button[type="submit"] {
      width: 100%;
      padding: 0.85rem;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      letter-spacing: 0.02em;
    }
    button[type="submit"]:hover { background: var(--accent-lt); }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Progress ── */
    #progress-card { display: none; }
    .stage-row {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 0.6rem;
    }
    .stage-icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 1px; }
    .stage-text { color: var(--text); font-size: 0.92rem; line-height: 1.5; }
    .log-row {
      padding-left: 1.85rem;
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 0.25rem;
    }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Results ── */
    #result-card { display: none; }
    .result-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .result-header h2 { font-size: 1.2rem; font-weight: 700; }
    .result-header .badge {
      background: var(--green);
      color: #000;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 99px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ── Formatted output ── */
    .output-body { line-height: 1.7; }
    .output-body p { margin-bottom: 0.5rem; color: var(--text); }
    .output-body .spacer { height: 0.5rem; }

    .output-body h2.caps-heading {
      font-size: 1rem;
      font-weight: 800;
      color: var(--accent-lt);
      margin: 1.5rem 0 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .output-body h3.section-heading {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--yellow);
      margin: 1.25rem 0 0.4rem;
    }

    .output-body .mcc-line {
      background: var(--mcc-bg);
      border-left: 3px solid var(--green);
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      margin: 0.4rem 0;
      color: var(--mcc-text);
    }
    .mcc-badge {
      background: var(--green);
      color: #000;
      font-weight: 800;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.88rem;
    }

    .output-body li {
      margin-left: 1.25rem;
      margin-bottom: 0.3rem;
      color: var(--text);
    }
    .output-body ul { margin-bottom: 0.5rem; }

    .output-body .numbered-item {
      padding-left: 0.25rem;
      margin-bottom: 0.35rem;
    }

    /* BLUF */
    .bluf-banner {
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      border: 1px solid #4f46e5;
      border-radius: 10px;
      padding: 0.8rem 1.1rem;
      font-size: 1.05rem;
      font-weight: 800;
      color: #a5b4fc;
      margin-bottom: 1rem;
      letter-spacing: 0.02em;
    }
    .bluf-item {
      background: var(--surface);
      border-left: 3px solid #6c63ff;
      border-radius: 0 8px 8px 0;
      padding: 0.55rem 0.9rem;
      margin-bottom: 0.5rem;
    }
    .bluf-key { color: var(--accent-lt); font-weight: 700; }
    .bluf-val { color: var(--text); }

    /* Section headers */
    .section-header {
      font-size: 1rem;
      font-weight: 800;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      margin: 1.5rem 0 0.75rem;
      letter-spacing: 0.03em;
    }
    .section-1 { background: #1a2744; border-left: 4px solid #60a5fa; color: #93c5fd; }
    .section-2 { background: #2d1515; border-left: 4px solid #ef4444; color: #fca5a5; }
    .section-3 { background: #1a2a1a; border-left: 4px solid #4ade80; color: #86efac; }

    /* Rationale / Merchant Framing */
    .rationale-block {
      background: #1e2535;
      border-radius: 6px;
      padding: 0.5rem 0.85rem;
      margin: 0.4rem 0;
      font-size: 0.88rem;
      color: #94a3b8;
    }
    .rationale-label { color: var(--yellow); font-weight: 700; }
    .merchant-framing { margin: 0.5rem 0 0.75rem; }
    .mf-label { color: var(--green); font-weight: 700; font-size: 0.88rem; }
    .mf-quote {
      border-left: 3px solid var(--green);
      margin: 0.35rem 0 0 0.5rem;
      padding: 0.4rem 0.75rem;
      color: #cbd5e1;
      font-style: italic;
      font-size: 0.9rem;
      background: #0f2318;
      border-radius: 0 6px 6px 0;
    }

    /* Red flag items in section 2 */
    li.red-flag-item {
      color: #fca5a5;
      font-weight: 500;
    }
    li.red-flag-item::marker { color: #ef4444; }

    /* Sub-headings */
    h4.sub-heading {
      color: var(--yellow);
      font-size: 0.92rem;
      font-weight: 700;
      margin: 1rem 0 0.35rem;
    }
    h3.caps-heading { color: var(--accent-lt); font-size: 0.95rem; font-weight: 800; margin: 1.2rem 0 0.4rem; }

    /* Iteration panel */
    .iterate-panel {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }
    .iterate-panel h3 { font-size: 0.9rem; color: var(--muted); margin-bottom: 0.85rem; font-weight: 600; }
    .iterate-buttons { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .btn-secondary {
      padding: 0.55rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font-size: 0.88rem;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .btn-secondary:hover { border-color: var(--accent); background: #1f2233; }
    .iterate-input { display: none; margin-top: 0.75rem; }
    .iterate-input textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
      padding: 0.65rem 0.85rem;
      outline: none;
      resize: vertical;
      min-height: 80px;
      font-family: inherit;
      margin-bottom: 0.6rem;
    }
    .iterate-input textarea:focus { border-color: var(--accent); }
    .iterate-result { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px dashed var(--border); }
    .iterate-result-header { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.75rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }

    /* ── Error ── */
    .error-msg {
      background: #2d1515;
      border: 1px solid var(--red);
      color: #fca5a5;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      margin-top: 1rem;
      display: none;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">💎</div>
    <h1>Check Me</h1>
    <p>MCC classification &amp; onboarding requirements — powered by 4 AI specialists</p>
  </header>

  <!-- Input form -->
  <div class="card">
    <form id="check-form">
      <div class="field">
        <label for="domain">🌐 Merchant Domain</label>
        <input type="url" id="domain" name="domain" placeholder="https://example.com" required />
      </div>
      <div class="field">
        <label for="flow">💸 Flow of Funds</label>
        <textarea id="flow" name="flow" placeholder="Describe how money moves through the business — e.g. consumer pays platform, platform pays seller minus 10% fee, weekly payouts via bank transfer." required></textarea>
      </div>
      <button type="submit" id="submit-btn">🔍 Run Check</button>
      <div class="error-msg" id="error-msg"></div>
    </form>
  </div>

  <!-- Progress -->
  <div class="card" id="progress-card">
    <div id="progress-log"></div>
  </div>

  <!-- Result -->
  <div class="card" id="result-card">
    <div class="result-header">
      <span style="font-size:1.4rem">✅</span>
      <h2>Final Recommendation</h2>
      <span class="badge">Complete</span>
    </div>
    <div class="output-body" id="result-body"></div>

    <!-- Iteration panel -->
    <div class="iterate-panel" id="iterate-panel" style="display:none">
      <h3>🔄 Continue the conversation</h3>
      <div class="iterate-buttons">
        <button class="btn-secondary" id="btn-detail" onclick="sendIteration('detail')">🔍 Get more detail on each requirement</button>
        <button class="btn-secondary" id="btn-addinfo" onclick="toggleAddInfo()">➕ Add more information</button>
      </div>
      <div class="iterate-input" id="iterate-input">
        <textarea id="iterate-text" placeholder="Add context, clarify the business model, provide additional information…"></textarea>
        <button type="button" class="btn-secondary" style="border-color: var(--accent); color: var(--accent-lt);" onclick="sendIteration('info')">Send to Synthesiser →</button>
      </div>
      <div id="iterate-results"></div>
    </div>
  </div>

  <footer>Check Me · MCC Multi-Gem Workflow</footer>

  <script>
    const form       = document.getElementById('check-form');
    const submitBtn  = document.getElementById('submit-btn');
    const progressCard = document.getElementById('progress-card');
    const progressLog  = document.getElementById('progress-log');
    const resultCard   = document.getElementById('result-card');
    const resultBody   = document.getElementById('result-body');
    const errorMsg     = document.getElementById('error-msg');

    let currentRunId = null;

    const STAGE_ICONS = {
      stage1:      '🚀',
      stage2:      '🧠',
      stage_done1: '✅',
      stage_done2: '✅',
      save:        '📄',
    };

    function addLog(msg) {
      const row = document.createElement('div');
      row.className = 'log-row';
      row.textContent = msg;
      progressLog.appendChild(row);
    }

    function addStage(icon, msg) {
      const row = document.createElement('div');
      row.className = 'stage-row';
      row.innerHTML = `<span class="stage-icon">${icon}</span><span class="stage-text">${msg}</span>`;
      progressLog.appendChild(row);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Reset UI
      progressLog.innerHTML = '';
      resultBody.innerHTML = '';
      errorMsg.style.display = 'none';
      progressCard.style.display = 'block';
      resultCard.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Running…';

      addStage('💎', 'Starting Check Me workflow…');

      const data = new FormData(form);

      try {
        const response = await fetch('/run', { method: 'POST', body: data });
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop(); // keep incomplete line

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            let event;
            try { event = JSON.parse(line.slice(6)); } catch { continue; }

            if (event.type === 'stage') {
              addStage(event.stage === 'stage1' ? '🚀' : '🧠', event.msg);
            } else if (event.type === 'stage_done') {
              addStage('✅', event.msg);
            } else if (event.type === 'log') {
              addLog(event.msg);
            } else if (event.type === 'save') {
              addLog('📄 ' + event.msg);
            } else if (event.type === 'error') {
              errorMsg.textContent = '⚠️ ' + event.msg;
              errorMsg.style.display = 'block';
            } else if (event.type === 'result') {
              resultBody.innerHTML = event.html;
              resultCard.style.display = 'block';
              resultCard.scrollIntoView({ behavior: 'smooth' });
              if (event.run_id) {
                currentRunId = event.run_id;
                document.getElementById('iterate-panel').style.display = 'block';
              }
            } else if (event.type === 'done') {
              addStage('🏁', 'Workflow complete.');
            }
          }
        }
      } catch (err) {
        errorMsg.textContent = '⚠️ Connection error: ' + err.message;
        errorMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '🔍 Run Check';
      }
    });

    function toggleAddInfo() {
      const inp = document.getElementById('iterate-input');
      inp.style.display = inp.style.display === 'none' ? 'block' : 'none';
    }

    async function sendIteration(type) {
      if (!currentRunId) return;

      const detailMsg = "Please detail out each specific requirement — expand every item in Section 1, Section 2, and Section 3 with full context, exact document names, and specific merchant-facing language where applicable.";
      const infoMsg = document.getElementById('iterate-text').value.trim();
      const message = type === 'detail' ? detailMsg : infoMsg;

      if (!message) return;

      // Disable buttons
      document.getElementById('btn-detail').disabled = true;
      document.getElementById('btn-addinfo').disabled = true;

      // Add a result container
      const container = document.createElement('div');
      container.className = 'iterate-result';
      container.innerHTML = `<div class="iterate-result-header">🧠 Updated Recommendation</div><div class="output-body iter-body"><span class="spinner"></span> Synthesiser is thinking…</div>`;
      document.getElementById('iterate-results').appendChild(container);
      const body = container.querySelector('.iter-body');

      const data = new FormData();
      data.append('run_id', currentRunId);
      data.append('message', message);

      try {
        const response = await fetch('/iterate', { method: 'POST', body: data });
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let firstResult = true;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            let event;
            try { event = JSON.parse(line.slice(6)); } catch { continue; }

            if (event.type === 'log') {
              if (firstResult) { body.innerHTML = ''; firstResult = false; }
              const p = document.createElement('div');
              p.className = 'log-row';
              p.textContent = event.msg;
              body.appendChild(p);
            } else if (event.type === 'result') {
              body.innerHTML = event.html;
              if (event.run_id) currentRunId = event.run_id;
              container.scrollIntoView({ behavior: 'smooth' });
            }
          }
        }
      } catch (err) {
        body.innerHTML = `<p style="color: var(--red)">⚠️ ${err.message}</p>`;
      } finally {
        document.getElementById('btn-detail').disabled = false;
        document.getElementById('btn-addinfo').disabled = false;
        if (type === 'info') document.getElementById('iterate-text').value = '';
      }
    }
  </script>
</body>
</html>
