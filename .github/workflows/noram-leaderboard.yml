name: NORAM L90 Leaderboard

# Refreshes the NORAM leaderboard Slack canvas on a rolling last-90-days basis
# (the window is always relative to the run). GitHub cron is UTC with no DST
# awareness, so we fire hourly across the UTC span that can cover ET business
# hours and let the "gate" step keep only weekday runs between 9am–6pm ET.
# The 9am ET run also DMs the link; intraday runs refresh the canvas silently.
on:
  schedule:
    - cron: "0 13-23 * * 1-5"  # hourly 13:00–23:00 UTC, Mon–Fri (covers 9am–6pm ET year-round)
  workflow_dispatch: {}         # manual runs allowed any time (bypass the gate, and DM)

concurrency:
  group: noram-leaderboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Gate to weekday business hours (America/New_York)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — bypassing gate; will notify."
            echo "notify=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          HOUR=$(TZ=America/New_York date +%H)
          DOW=$(TZ=America/New_York date +%u)   # 1=Mon .. 7=Sun
          echo "New York: day-of-week=$DOW hour=$HOUR"
          if [ "$DOW" -gt 5 ] || [ "$HOUR" -lt 9 ] || [ "$HOUR" -gt 18 ]; then
            echo "Outside weekday 9am–6pm ET — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # DM only on the 9am run; other business-hours runs refresh silently.
          if [ "$HOUR" = "09" ]; then echo "notify=1" >> "$GITHUB_OUTPUT"; else echo "notify=0" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r noram-leaderboard/requirements.txt

      - name: Refresh leaderboard canvas
        if: steps.gate.outputs.skip != 'true'
        env:
          SF_ACCESS_TOKEN: ${{ secrets.SF_ACCESS_TOKEN }}
          SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_CANVAS_ID: ${{ secrets.SLACK_CANVAS_ID }}
          SLACK_TEAM_ID: ${{ secrets.SLACK_TEAM_ID }}
          SLACK_DM_CHANNEL: ${{ secrets.SLACK_DM_CHANNEL }}
          NOTIFY: ${{ steps.gate.outputs.notify }}
        run: python noram-leaderboard/leaderboard.py
